apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-clients
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-clients
  template:
    metadata:
      labels:
        app: postgres-clients
    spec:
      containers:
        - name: postgres-clients
          image: postgres:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "clientsServiceDb"
            - name: POSTGRES_USER
              value: "AkiraKilla"
            - name: POSTGRES_PASSWORD
              value: "SuperSecretPassword"
            - name: POSTGRES_HOST_AUTH_METHOD  
              value: "md5"
            - name: PG_HBA_CONFIG  
              value: |
                local   all             all                                     md5
                host    all             all             127.0.0.1/32            md5
                host    all             all             ::1/128                 md5
                host    all             all             0.0.0.0/0               md5
          volumeMounts:
            - mountPath: /var/opt/postgresql/data
              name: postgresql-db
      volumes:
        - name: postgresql-db
          persistentVolumeClaim:
            claimName: postgresql-clients-claim
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-clients-internal
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  selector:
    app: postgres-clients
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-clients-external
spec:
  type: NodePort
  selector:
    app: postgres-clients
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30002  
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-clients-external
spec:
  type: LoadBalancer
  selector:
    app: postgres-clients
  ports:
    - port: 5432
      targetPort: 5432